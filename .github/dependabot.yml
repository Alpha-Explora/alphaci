# Dependency updates for the monorepo.
#
# npm: one root lockfile for every workspace. Updates arrive weekly in grouped
# pull requests, one per family, majors included.
#
# docker: Node base images, majors included. A Node major also moves CI's
# NODE_VERSION, .nvmrc, the root engines and @types/node, so finish such a pull
# request by hand before merging it, and close odd majors (not LTS). The same
# goes for an @types/node major in the npm groups.
#
# A version must be public for 3 days before Dependabot proposes it, so a
# compromised or quickly yanked release is less likely to reach a pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Manila
    cooldown:
      default-days: 3
    open-pull-requests-limit: 8
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    ignore:
      # `typescript` stays on 6: ts-jest, typescript-eslint, Nest's emit and
      # `next build` need its programmatic API, which TypeScript 7.0 does not have.
      # TypeScript 7 is the `typescript-7` alias, used only by `typecheck`, and
      # gets its updates under that name. Lift this when 7 ships the API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      next-and-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - eslint-plugin-react-hooks
      typescript-and-lint:
        patterns:
          - typescript
          - typescript-eslint
          - '@typescript-eslint/*'
          - eslint
          - '@eslint/*'
          - 'eslint-*'
          - prettier
          - globals
          - stylelint
          - 'stylelint-*'
          - dependency-cruiser
      test-tooling:
        patterns:
          - jest
          - 'jest-*'
          - '@types/jest'
          - ts-jest
          - '@testing-library/*'
          - playwright
          - supertest
          - '@types/supertest'
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
    groups:
      base-images:
        patterns: ['*']
