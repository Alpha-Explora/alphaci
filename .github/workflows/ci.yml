name: CI

# One pipeline for the monorepo.
#
# `plan` installs dependencies once and decides which apps a pull request
# affects (.github/scripts/plan-affected.sh). Every other job restores that
# install and runs one slice of one app's checks in parallel. Pushes to main,
# the nightly run and manual runs check everything.
#
# `ci-passed` is the only check the main ruleset requires: it fails when any
# job failed or was cancelled, and passes when jobs were skipped because their
# app was not affected.
#
# Local equivalents run from the repository root, for example:
#   npx turbo run lint typecheck test --filter=@alphaci/api

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    # 04:00 Asia/Manila. Catches anything the affected logic missed.
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 26
  # Optional Vercel Remote Cache. Turborepo uses it when both are set and
  # falls back to running every task when they are not.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      # Full history, no file contents until needed: the affected check diffs
      # against the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pull requests can read caches written on main, and every push to main
      # runs this job, so a pull request starts from a warm install unless it
      # changes the lockfile.
      - id: cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            .github/scripts/plan-affected.sh "origin/$BASE_REF" | tee -a "$GITHUB_OUTPUT"
          else
            .github/scripts/plan-affected.sh full | tee -a "$GITHUB_OUTPUT"
          fi

      # A dependency listed by more than one workspace must use one version
      # range everywhere (scripts/check-versions.mjs). Reads the package.json
      # files only, so it costs nothing and runs on every pull request.
      - name: Shared dependency versions match
        run: npm run check:versions

      # docs/ is one bundle for both apps and belongs to neither package, so a
      # docs-only change affects no app job. Check it here, on every event:
      # format, links, naming, and drift in the maps and pack profiles both
      # apps generate into it.
      - name: Documentation bundle
        run: |
          npm run test:documentation
          node scripts/check-documentation.cjs

  affected-guard:
    name: Affected detection guard
    if: github.event_name == 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: .github/scripts/affected-guard.sh

  api:
    name: API ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            tasks: lint format:check
          - name: typecheck and build
            tasks: typecheck build
          - name: tests
            tasks: test
            args: -- --ci --runInBand
          - name: architecture and documentation
            tasks: >-
              boundaries check:application-boundaries check:architecture-metrics
              check:provider-encapsulation check:schema-ownership check:capabilities
              check:capability-package check:composition-source check:capability-ledger
              check:composition-profiles check:migration-order check:documentation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      # Turbo's task cache: a rerun, or a later commit that leaves a task's
      # inputs unchanged, replays the result instead of running the task. A
      # pull request also restores from its base branch's newest entry.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-api-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-api-${{ matrix.name }}-
      - name: turbo run ${{ matrix.tasks }}
        run: npx turbo run ${{ matrix.tasks }} --filter=@alphaci/api --continue ${{ matrix.args }}

  api-e2e:
    name: API end-to-end (Postgres fixture)
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # project-creation-environments reads the central workflow templates
      # from this path, checked out next to the repository below.
      TEMPLATE_REPO_PATH: ${{ github.workspace }}/alphaci-workflow
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Public repository. It must sit inside the workspace: actions/checkout
      # refuses paths outside it. Pinned to the commit the suite was last run
      # against. To bump it, run the suite against the new commit, then change
      # `ref` here in the same pull request.
      - uses: actions/checkout@v7
        with:
          repository: Alpha-Explora/alphaci-workflow
          ref: 0e584eb948951c855fe46a3493a2b395b8a5d208
          path: alphaci-workflow
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      # Turbo's task cache: a rerun, or a later commit that leaves a task's
      # inputs unchanged, replays the result instead of running the task. A
      # pull request also restores from its base branch's newest entry.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-api-e2e-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-api-e2e-

      # global-setup starts the disposable Postgres fixture with docker compose.
      - run: npx turbo run test:e2e --filter=@alphaci/api

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: apps/api/artifacts/e2e/
          if-no-files-found: ignore

  # Every tests/integration/*.integration.spec.ts against real PostgreSQL:
  # migration replays, the self-hosted migration runner, the outbox contract.
  # Each spec skips itself without a database; tests/integration/run.ts
  # starts the disposable fixture and gives each spec the database it reads.
  api-integration:
    name: API integration (Postgres fixture)
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run test:integration -w @alphaci/api

  # The web app against the real API (apps/web/tests/fullstack/run.ts): the
  # API e2e Postgres fixture, the self-hosted migrator, the compiled API in
  # self-hosted mode with quick login, `next build` + `next start`, and
  # Playwright journeys. Runs when either app is affected.
  fullstack-e2e:
    name: Full-stack e2e
    needs: plan
    if: needs.plan.outputs.api == 'true' || needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      # The browser download is keyed on the installed Playwright version. The
      # system libraries it needs are not in the cache, so a hit still
      # installs those.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:fullstack -w @alphaci/web

      - name: Upload full-stack report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fullstack-e2e-report
          path: apps/web/test-results/fullstack/
          if-no-files-found: ignore

  web:
    name: Web ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            tasks: lint lint:css format:check
          - name: typecheck
            tasks: typecheck
          - name: tests
            tasks: test
            args: -- --ci
          - name: architecture and documentation
            tasks: >-
              boundaries arch:check check:capabilities
              check:profiles check:documentation complexity
          # The two profile builds both write .next, so each gets its own job.
          - name: hosted profile build
            tasks: check:profile-build:hosted
          - name: enterprise profile build
            tasks: check:profile-build:enterprise
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      # Turbo's task cache: a rerun, or a later commit that leaves a task's
      # inputs unchanged, replays the result instead of running the task. A
      # pull request also restores from its base branch's newest entry.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-web-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-web-${{ matrix.name }}-
      - name: turbo run ${{ matrix.tasks }}
        run: npx turbo run ${{ matrix.tasks }} --filter=@alphaci/web --continue ${{ matrix.args }}

  ci-passed:
    name: ci-passed
    if: always()
    needs: [plan, affected-guard, api, api-e2e, api-integration, fullstack-e2e, web]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended as '$result'."; exit 1 ;;
            esac
          done
