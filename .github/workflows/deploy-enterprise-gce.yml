name: Deploy enterprise (GCE)

# Deploys AlphaCI and its settings to the enterprise Compute Engine VM
# (alphaci-enterprise-01, https://enterprise.alphaci.com.ph) once CI passes on
# a push to main. A manual run deploys any ref, and applies settings changed
# in the enterprise-gce environment without a code change.
#
#   plan    resolves the commit and looks for its images in GHCR.
#   images  builds and pushes them with release.yml when they are missing.
#   deploy  renders alphaci.env and the secret files from the enterprise-gce
#           environment (deploy/enterprise-gce/), signs in to Google Cloud with
#           workload identity federation, SSHes to the VM through IAP and runs
#           deploy/enterprise-gce/rollout.sh.
#
# Migrations are not applied. The VM's database is Supabase, migrated outside
# the self-hosted ledger, so the deploy stops when anything under
# apps/api/supabase/migrations changed since the deployed revision, when no
# revision is recorded yet, and for a rollback. Apply or check the
# migrations, then run this workflow by hand with `migrations_reviewed`.
#
# When the VM is stopped (enterprise-gce-power.yml), an automatic run skips
# with a notice and a manual run fails. Start the VM, then deploy by hand.
#
# Settings, setup and operation: docs/runbooks/runbook-enterprise-gce-deploy.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to deploy (the deployed one again to apply changed settings)
        type: string
        default: main
      migrations_reviewed:
        description: Migrations since the deployed revision are applied or checked (needed for the first deploy, a migration change, or a rollback)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time. A newer queued run replaces an older queued one.
concurrency:
  group: deploy-enterprise-gce
  cancel-in-progress: false

env:
  MIGRATIONS_DIR: apps/api/supabase/migrations

jobs:
  plan:
    name: Plan
    # CI also runs on main from the nightly schedule and by hand; only a
    # green push deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      build: ${{ steps.images.outputs.build }}
      api: ${{ steps.images.outputs.api }}
      web: ${{ steps.images.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A commit already built, such as a rerun to apply changed settings,
      # deploys the same digests instead of new ones.
      - id: images
        run: |
          tag="sha-$(git rev-parse --short=7 HEAD)"
          for image in alphaci-be alphaci-fe; do
            if ! digest=$(docker buildx imagetools inspect "ghcr.io/alpha-explora/$image:$tag" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              echo "ghcr.io/alpha-explora/$image:$tag is not published; building both images."
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            key=$([[ $image == alphaci-be ]] && echo api || echo web)
            echo "$key=ghcr.io/alpha-explora/$image@$digest" >> "$GITHUB_OUTPUT"
          done
          echo "Both images exist for $tag; reusing them."
          echo "build=false" >> "$GITHUB_OUTPUT"

  images:
    name: Images
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/release.yml
    # A ceiling for release.yml's jobs, which set their own. Its GitHub
    # Release job asks for contents: write and runs for tags only.
    permissions:
      contents: write
      packages: write
    with:
      push: true
      ref: ${{ needs.plan.outputs.sha }}

  deploy:
    name: Deploy
    needs: [plan, images]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Variables and secrets come from this environment, and the workload
    # identity binding admits it only.
    environment:
      name: enterprise-gce
      url: ${{ vars.DEPLOY_PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      TARGET_SHA: ${{ needs.plan.outputs.sha }}
      GCP_PROJECT: ${{ vars.DEPLOY_GCP_PROJECT }}
      GCP_ZONE: ${{ vars.DEPLOY_GCP_ZONE }}
      GCE_INSTANCE: ${{ vars.DEPLOY_GCE_INSTANCE }}
      PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Before anything else, so a missing setting fails fast and by name.
      - name: Render settings
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          # One line per name in deploy/enterprise-gce/secret-files. Named one by
          # one: GitHub holds a workflow that hands toJSON(secrets) to a remote
          # host for manual approval as possibly malicious.
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SECRET_GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          SECRET_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SECRET_GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          SECRET_RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SECRET_ENV_PROVISIONING_ENCRYPTION_KEY: ${{ secrets.ENV_PROVISIONING_ENCRYPTION_KEY }}
          SECRET_ONPREM_REGISTRY_TOKEN: ${{ secrets.ONPREM_REGISTRY_TOKEN }}
          SECRET_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for name in GCP_PROJECT GCP_ZONE GCE_INSTANCE PUBLIC_URL; do
            [[ -n "${!name}" ]] || { echo "::error::Set the variable DEPLOY_$name in the enterprise-gce environment."; exit 1; }
          done
          deploy/enterprise-gce/render.sh "$RUNNER_TEMP/settings"

      - if: needs.images.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Image digests
        id: digests
        env:
          BUILT: ${{ needs.images.result == 'success' }}
          PLANNED_API: ${{ needs.plan.outputs.api }}
          PLANNED_WEB: ${{ needs.plan.outputs.web }}
        run: |
          if [[ "$BUILT" == "true" ]]; then
            echo "api=$(cat digests/alphaci-be)" >> "$GITHUB_OUTPUT"
            echo "web=$(cat digests/alphaci-fe)" >> "$GITHUB_OUTPUT"
          else
            echo "api=$PLANNED_API" >> "$GITHUB_OUTPUT"
            echo "web=$PLANNED_WEB" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # OS Login keys gcloud adds for this run expire on their own.
      - name: SSH helper
        run: |
          cat > "$RUNNER_TEMP/vm" <<'EOF'
          #!/usr/bin/env bash
          exec gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
            --tunnel-through-iap --ssh-key-expire-after 1h --quiet "$@"
          EOF
          chmod +x "$RUNNER_TEMP/vm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # A stopped VM would otherwise fail at SSH with an unclear error.
      - name: VM status
        env:
          EVENT: ${{ github.event_name }}
        run: |
          status=$(gcloud compute instances describe "$GCE_INSTANCE" --project "$GCP_PROJECT" --zone "$GCP_ZONE" --format='value(status)')
          [[ "$status" == RUNNING ]] && exit 0
          message="$GCE_INSTANCE is $status. Start it with the Enterprise VM power workflow, then run this workflow by hand for $TARGET_SHA."
          echo "### Deploy skipped: VM is $status" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::notice::$message"
          echo "SKIP=true" >> "$GITHUB_ENV"

      - name: Migration gate
        if: env.SKIP != 'true'
        env:
          EVENT: ${{ github.event_name }}
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed == true }}
        run: |
          deployed=$(vm --command 'sudo cat /opt/alphaci/.deployed-revision 2>/dev/null || true' </dev/null |
            sed -n 's/^revision=//p' | head -n 1)
          echo "Deployed: ${deployed:-none recorded}; target: $TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

          review=''
          if [[ -z "$deployed" ]]; then
            review='No deployed revision is recorded on the VM, so the migrations it needs are unknown.'
          elif [[ "$deployed" == "$TARGET_SHA" ]]; then
            echo "Same revision; applying settings only." | tee -a "$GITHUB_STEP_SUMMARY"
          elif ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            review="The deployed revision $deployed is not in this repository's history."
          elif git merge-base --is-ancestor "$deployed" "$TARGET_SHA"; then
            changed=$(git diff --name-only "$deployed" "$TARGET_SHA" -- "$MIGRATIONS_DIR")
            if [[ -n "$changed" ]]; then
              review=$'Migrations changed since the deployed revision:\n'"$changed"
            fi
          elif [[ "$EVENT" == "workflow_run" ]] && git merge-base --is-ancestor "$TARGET_SHA" "$deployed"; then
            echo "::notice::A newer revision is already deployed; stopping this older run."
            echo "A newer revision is already deployed; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          else
            review='The target is not a descendant of the deployed revision (a rollback or rewritten history).'
          fi

          if [[ -n "$review" && "$MIGRATIONS_REVIEWED" != "true" ]]; then
            {
              echo "### Deploy stopped"
              echo '```'
              echo "$review"
              echo '```'
              echo "Apply or check the migrations against the VM's database, then run this workflow by hand"
              echo "for $TARGET_SHA with **migrations_reviewed** ticked."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$(head -n 1 <<< "$review") Apply or check them, then rerun by hand with migrations_reviewed."
            exit 1
          fi
          if [[ -n "$review" ]]; then
            echo "::warning::Deploying past the migration gate: $(head -n 1 <<< "$review")"
          fi

      - name: Roll out
        if: env.SKIP != 'true'
        env:
          API_IMAGE: ${{ steps.digests.outputs.api }}
          WEB_IMAGE: ${{ steps.digests.outputs.web }}
          GHCR_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          remote=/tmp/alphaci-rollout-${GITHUB_RUN_ID}.sh
          gcloud compute scp deploy/enterprise-gce/rollout.sh "$GCE_INSTANCE:$remote" \
            --project "$GCP_PROJECT" --zone "$GCP_ZONE" --tunnel-through-iap --ssh-key-expire-after 1h --quiet
          { echo "token $(printf '%s' "$GHCR_TOKEN" | base64 -w0)"; cat "$RUNNER_TEMP/settings"; } |
            vm --command "sudo bash $remote '$API_IMAGE' '$WEB_IMAGE' '$TARGET_SHA' '$REGISTRY_USER'; status=\$?; rm -f $remote; exit \$status"
          rm -f "$RUNNER_TEMP/settings"
          {
            echo "### Deployed $TARGET_SHA"
            echo '```'
            echo "ALPHACI_API_IMAGE=$API_IMAGE"
            echo "ALPHACI_WEB_IMAGE=$WEB_IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Public health check
        if: env.SKIP != 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 "$PUBLIC_URL/api/v1/health" >/dev/null
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 "$PUBLIC_URL/healthz" >/dev/null
          echo "$PUBLIC_URL answers on /api/v1/health and /healthz." >> "$GITHUB_STEP_SUMMARY"
