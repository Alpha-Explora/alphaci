name: Release images

# Builds the two self-hosted images from the repository root and, for a
# release, pushes them to GHCR:
#   ghcr.io/alpha-explora/alphaci-be   (apps/api/Dockerfile)
#   ghcr.io/alpha-explora/alphaci-fe   (apps/web/Dockerfile, self-hosted args)
#
# - Tag `v<version>` (for example v1.4.0): build, push `<version>` and
#   `sha-<commit>`, attach provenance and an SBOM, and publish a GitHub
#   Release whose notes carry both digests in the form
#   deploy/selfhost/.env expects.
# - Pull requests that touch the images' inputs: build both, push nothing, so
#   a broken Dockerfile fails the pull request instead of the release.
# - Manual run: build; push only when `push` is ticked (no GitHub Release).
# - Called by another workflow (deploy-enterprise-gce.yml): build `ref`, push
#   `sha-<commit>` when `push` is true, and leave each digest in a
#   `digest-<image>` artifact for the caller.
#
# GHCR packages are created private on the first push. Customers pull them
# without credentials, so make both packages public once (org Packages ->
# package settings -> Change visibility).

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - apps/api/Dockerfile
      - apps/web/Dockerfile
      - .dockerignore
      - package-lock.json
      - turbo.json
      - deploy/selfhost/postgres-init/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to GHCR
        type: boolean
        default: false
  workflow_call:
    inputs:
      push:
        description: Push the images to GHCR
        type: boolean
        default: false
      ref:
        description: Commit to build (default the triggering ref)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: alphaci-be
            dockerfile: apps/api/Dockerfile
          - app: web
            image: alphaci-fe
            dockerfile: apps/web/Dockerfile
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The commit actually checked out. A caller's `ref` differs from
      # github.sha, which metadata-action would otherwise tag and label.
      - id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alpha-explora/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ steps.rev.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # Build arguments per image. The API bakes the `v1` catalog of the
      # public alphaci-workflow repository, the ref customer pipelines call
      # (CENTRAL_WORKFLOW_REF defaults to v1). It clones with this job's
      # GITHUB_TOKEN, which expires with the job, so no long-lived credential
      # can surface in build metadata. The web image uses the fixed
      # self-hosted arguments from docs/runbooks/runbook-selfhost-web-image.md.
      - id: args
        env:
          APP: ${{ matrix.app }}
          CLONE_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'value<<EOF'
            if [[ "$APP" == "api" ]]; then
              echo "TEMPLATE_REPO_REF=v1"
              echo "TEMPLATE_CLONE_TOKEN=$CLONE_TOKEN"
            else
              echo "NEXT_PUBLIC_API_BASE_URL=/api/v1"
              echo "ALPHACI_BUILD_PROFILE=enterprise"
              echo "ALPHACI_EDITION=enterprise"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.args.outputs.value }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PUSH == 'true' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the digest
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "ghcr.io/alpha-explora/${IMAGE}@${DIGEST}" > "digests/${IMAGE}"
          echo "ghcr.io/alpha-explora/${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Publish the release with both digests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          api="$(cat digests/alphaci-be)"
          web="$(cat digests/alphaci-fe)"
          {
            echo "Self-hosted AlphaCI ${TAG#v}."
            echo
            echo "Pin these in \`/opt/alphaci/.env\` (see \`deploy/selfhost/.env.example\`):"
            echo
            echo '```'
            echo "ALPHACI_API_IMAGE=${api}"
            echo "ALPHACI_WEB_IMAGE=${web}"
            echo '```'
            echo
            echo "Upgrade steps: docs/runbooks/runbook-selfhost-install.md."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "AlphaCI ${TAG#v}" --notes-file notes.md
          fi
